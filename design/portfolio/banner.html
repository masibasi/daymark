<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:2400px;height:1260px;overflow:hidden;font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;background:#FBFAF8;position:relative}
.blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55}
.copy{position:absolute;left:180px;top:50%;transform:translateY(-50%);width:820px}
.icon{width:150px;height:150px;border-radius:34px;box-shadow:0 18px 50px rgba(30,30,60,.14),0 0 0 1px rgba(0,0,0,.04)}
h1{font-size:132px;letter-spacing:-5px;font-weight:800;color:#141414;margin:44px 0 18px}
p{font-size:46px;line-height:1.3;color:#5b5b63;font-weight:500;letter-spacing:-.5px}
.tag{margin-top:40px;display:flex;gap:14px}
.tag span{font-size:26px;color:#3d3d45;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.07);padding:10px 22px;border-radius:999px}
.phone{position:absolute;width:520px;border-radius:64px;padding:14px;background:#111;box-shadow:0 50px 120px rgba(30,30,70,.25)}
.phone img{width:100%;display:block;border-radius:52px}
.p1{right:620px;top:150px;transform:rotate(-4deg)}
.p2{right:150px;top:110px;transform:rotate(5deg)}
</style></head><body>
<div class="blob" style="width:900px;height:900px;background:#FAA475;left:-200px;top:-300px"></div>
<div class="blob" style="width:800px;height:800px;background:#976EF1;right:-150px;bottom:-350px;opacity:.35"></div>
<div class="blob" style="width:700px;height:700px;background:#5792FB;right:700px;top:-350px;opacity:.3"></div>
<div class="blob" style="width:600px;height:600px;background:#EA708C;left:500px;bottom:-400px;opacity:.3"></div>
<div class="copy">
  <img class="icon" src="../../public/icons/icon-512.png">
  <h1>Daymark</h1>
  <p>Plan loosely, move freely,<br>and remember what you did.</p>
  <div class="tag"><span>Local-first PWA</span><span>Draw your own Day Mark</span><span>EN · 한국어</span></div>
</div>
<div class="phone p1"><img src="shots/phone-today.png"></div>
<div class="phone p2"><img src="shots/phone-reflect-month.png"></div>
</body></html>
